<article class="plato">
  <img [src]="catalogo.urlImagen(plato.imagen_path)" [alt]="plato.nombre">
  <div class="info">
    <h4>{{ plato.nombre }}</h4>
    <p>{{ plato.descripcion }}</p>
    <div class="pie">
      <strong class="precio">{{ catalogo.formatoPrecio(plato.precio) }}</strong>
      @if (auth.perfil()?.rol !== 'restaurante') {
        <button class="boton-compra" (click)="agregar()">Agregar</button>
      }
    </div>
    @if (mensaje() !== '') {
      <small class="nota">{{ mensaje() }}</small>
    }
  </div>
</article>
